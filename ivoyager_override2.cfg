; Test probe -- an instrument for automated tests, added to the program so the
; Assistant's call can reach the members it declares. tests/template_test.py
; drives it; its class doc says what it offers.
;
; Kept apart from ivoyager_override.cfg so a project made from the template can
; drop the probe by deleting this file and tests/.

[core_initializer]

program_refcounteds/TestProbe="res://tests/test_probe.gd"
